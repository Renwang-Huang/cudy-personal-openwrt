name: Inspect published TR3600 candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published TR3600 candidate tag
        required: true
        default: tr3600-v0.1.0-candidate
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - name: Download public candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work/tr3600-source/bin/targets/mediatek/filogic
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*cudy_tr3600-v1*' --pattern 'tr3600-verification.json' --dir work/tr3600-source/bin/targets/mediatek/filogic
          cp work/tr3600-source/bin/targets/mediatek/filogic/tr3600-verification.json work/expected-tr3600-verification.json
      - name: Inspect image, device tree, software and slot checks
        run: |
          python3 devices/tr3600/scripts/verify-image.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('work/expected-tr3600-verification.json').read_text())
          actual = json.loads(Path('work/tr3600-source/bin/targets/mediatek/filogic/tr3600-verification.json').read_text())
          for field in ('sha256', 'kernel_sha256', 'rootfs_sha256', 'initramfs_sha256'):
              assert expected[field] == actual[field], field
          print('Published candidate hashes and static checks verified independently.')
          PY
