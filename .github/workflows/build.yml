name: Build TR3000 candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageBuilder host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd squashfs-tools
      - name: Reproduce candidate from verified release assets
        run: python3 scripts/reproduce-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: tr3000-personal-candidate
          path: output/
          if-no-files-found: error
