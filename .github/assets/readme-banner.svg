      <text x="64" y="157" fill="#F4F8FF" font-size="68" font-weight="700" letter-spacing="-2">Personal OpenWrt</text>
      <text x="68" y="207" fill="#A4B7CD" font-size="23" letter-spacing="0.1">Minimal firmware. Reproducible builds.</text>
      <rect x="68" y="263" width="122" height="37" rx="8" fill="#172B40" stroke="#2B465E"/>
