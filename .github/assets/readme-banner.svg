<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cudy Personal OpenWrt</title>
  <desc id="desc">Minimal firmware and reproducible builds for Cudy TR1200, TR3000 and TR3600 routers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C30"/>
      <stop offset="0.55" stop-color="#0B1527"/>
      <stop offset="1" stop-color="#0C2934"/>
    </linearGradient>
    <linearGradient id="accent" x1="960" y1="90" x2="1250" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79DDF0"/>
      <stop offset="1" stop-color="#38C9AD"/>
    </linearGradient>
    <linearGradient id="edge" x1="960" y1="110" x2="1290" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" x="810" y="0" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#94B8D4" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="round"><rect width="1400" height="380" rx="20"/></clipPath>
  </defs>
